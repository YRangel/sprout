name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      ANDROID_TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # same explicit pin as ci.yml (see rust-toolchain.toml); the
          # implicit-read fired an exit-101 cargo failure on the arm runner.
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2

      # arm runner image lacks the native C compiler the build scripts of
      # sprout-preload/sprout-ptrace spawn (cc::Build -> `cc`); without it
      # cargo aborts with exit 101 at the first build-script execution.
      - name: install native C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # Smoke: the usual linux-gnu workspace build (keeps this workflow a
      # CI lane too, and produces the GUEST-side glibc interposer .so).
      # DIAG: on arm this keeps failing with bare exit 101 and no readable
      # logs for unauthenticated viewers, so the failing lines are mirrored
      # into check-run annotations via ::error::.
      - name: cargo build --release --workspace (fail-loud diag)
        run: |
          if ! cargo build --release --workspace 2>/tmp/cb.err; then
            rc=$?
            echo "::error::cargo build exit=$rc — error-grep:"
            grep -E "error|panic" /tmp/cb.err | tail -n 6 | while IFS= read -r l; do echo "::error::E| $l"; done
            echo "::error::stderr tail:"
            tail -n 5 /tmp/cb.err | while IFS= read -r l; do echo "::error::T| $l"; done
            exit 101
          fi

      # Termux-host artifacts must be linked against **bionic** — use the
      # Android NDK clang (real bionic headers/libs), not zig's synthetic
      # android target (cargo-zigbuild .28 aborted with
      # "Malformed zig target abi suffix"). zig stays ON ONLY for the musl
      # guest interposer build further below.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - uses: android-actions/setup-android@v3

      - name: ensure NDK + configure android linker
        run: |
          set -eu
          # newest NDK: prefer a preinstalled one; else sdkmanager to newest listed
          ND=$(ls -d "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-aarch64/bin 2>/dev/null | tail -1 || true)
          if [ -z "$ND" ]; then
            CANDID=$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -u | tail -1)
            test -n "$CANDID" || { echo "::error::sdkmanager lists no NDK"; exit 1; }
            yes | sdkmanager --install "$CANDID" >/dev/null
            ND=$(ls -d "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-aarch64/bin 2>/dev/null | tail -1)
          fi
          CLANG="$ND/aarch64-linux-android28-clang"
          test -x "$CLANG" || { echo "::error::missing $CLANG"; exit 1; }
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"

      - name: android-target workspace build (sprout + sprout-super for bionic hosts)
        run: |
          rustup target add aarch64-linux-android
          cargo build --release --workspace --target "$ANDROID_TARGET"

      - name: collect artifacts (android launcher/supervisor + glibc interposer + musl interposer)
        run: |
          mkdir -p dist
          cp target/$ANDROID_TARGET/release/sprout dist/sprout
          sup=$(find target/$ANDROID_TARGET/release/build/sprout-ptrace-*/out -name sprout-super | head -1)
          test -n "$sup" && cp "$sup" dist/sprout-super
          so=$(find target/release/build/sprout-preload-*/out -name libsprout-core.so | head -1)
          test -n "$so" && cp "$so" dist/libsprout-core.so
          # musl guest interposer: zig cc against alpine-linux-musl
          zig cc -target aarch64-linux-musl \
            -std=c11 -O2 -Wall -Wextra -D_GNU_SOURCE \
            -fPIC -shared -DSPROUT_INTERPOSE \
            -o dist/libsprout-core-musl.so \
            crates/sprout-preload/csrc/sprout_preload.c -ldl
          chmod 0755 dist/* || true
          tar -C dist -cJf dist/sprout-aarch64-termux.tar.xz \
            sprout sprout-super libsprout-core.so libsprout-core-musl.so
          cd dist && sha256sum sprout sprout-super libsprout-core.so libsprout-core-musl.so sprout-aarch64-termux.tar.xz > SHA256SUMS

      # Fail loudly rather than ship silent garbage: ELF kinds plus the
      # interposer's ADR-0020 shm interpose must be present in both flavors
      # (they're the latest ABI registration, cf. crates/sprout-preload/csrc).
      - name: verify artifacts (ELF + ADR-0020 shm symbols present)
        run: |
          set -eu
          file dist/*
          nm -D dist/libsprout-core.so | grep -qE ' T shmget' || { echo 'glibc interposer missing shm interpose (ADR-0020)'; exit 1; }
          nm -D dist/libsprout-core-musl.so | grep -qE ' T shmget' || { echo 'musl interposer missing shm interpose (ADR-0020)'; exit 1; }
          # android binaries must not drag glibc: check dynamic section for libc.so
          objdump -p dist/sprout | grep -E 'NEEDED.*libc' || : ; echo 'android-binaries-linked (bionic target) check done'
          echo OK: dist verified

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: sprout-aarch64-termux
          path: dist/*
          retention-days: 30

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/book/html  # mdbook >=0.4.36 multi-backend layout: html/ and linkcheck/ subdirs
