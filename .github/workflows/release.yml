name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # same explicit pin as ci.yml (see rust-toolchain.toml); the
          # implicit-read fired an exit-101 cargo failure on the arm runner.
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2

      # arm runner image lacks the native C compiler the build scripts of
      # sprout-preload/sprout-ptrace spawn (cc::Build -> `cc`); without it
      # cargo aborts with exit 101 at the first build-script execution.
      - name: install native C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # Smoke: the usual linux-gnu workspace build (keeps this workflow a
      # CI lane too, and produces the GUEST-side glibc interposer .so).
      # DIAG: on arm this keeps failing with bare exit 101 and no readable
      # logs for unauthenticated viewers, so the failing lines are mirrored
      # into check-run annotations via ::error::.
      - name: cargo build --release --workspace (fail-loud diag)
        run: |
          if ! cargo build --release --workspace 2>/tmp/cb.err; then
            rc=$?
            echo "::error::cargo build exit=$rc — error-grep:"
            grep -E "error|panic" /tmp/cb.err | tail -n 6 | while IFS= read -r l; do echo "::error::E| $l"; done
            echo "::error::stderr tail:"
            tail -n 5 /tmp/cb.err | while IFS= read -r l; do echo "::error::T| $l"; done
            exit 101
          fi

      # Termux-host artifacts must be linked against **bionic** — use the
      # Android NDK clang (real bionic headers/libs), not zig's synthetic
      # android target (cargo-zigbuild .28 aborted with
      # "Malformed zig target abi suffix"). zig stays ON ONLY for the musl
      # guest interposer build further below.
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      # ANDROID HOST BINARIES (sprout + sprout-super) CANNOT be linked on
      # GitHub runners. Proof chain: cargo-zigbuild aborts on
      # "Malformed zig target abi suffix" for the .28 abi; android-actions/
      # setup-android's sdkmanager dies on cmdline-tools 16.0 ("Dependant
      # package with key emulator not found"); cross-rs's x86_64 container
      # under binfmt-qemu can start but its in-container rustup rejects any
      # x86_64 toolchain install on the emulated aarch64 host check.
      # Termux/bionic host binaries MUST be built on-device (the native
      # build host) or on a self-hosted Termux runner
      # (.github/workflows/termux-selfhosted.yml). Until a runner is
      # attached, this release ships guest-side artifacts only
      # (the two interposer DSOs; the launcher stays an on-device
      # `cargo build --release` per README).
      
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: collect artifacts (glibc + musl guest interposers)
        run: |
          mkdir -p dist
          so=$(find target/release/build/sprout-preload-*/out -name libsprout-core.so | head -1)
          test -n "$so" && cp "$so" dist/libsprout-core.so
          # musl guest interposer: zig cc against alpine-linux-musl
          zig cc -target aarch64-linux-musl \
            -std=c11 -O2 -Wall -Wextra -D_GNU_SOURCE \
            -fPIC -shared -DSPROUT_INTERPOSE \
            -o dist/libsprout-core-musl.so \
            crates/sprout-preload/csrc/sprout_preload.c -ldl
          chmod 0755 dist/* || true
          tar -C dist -cJf dist/sprout-guest-interposers-aarch64.tar.xz \
            libsprout-core.so libsprout-core-musl.so
          cd dist && sha256sum libsprout-core.so libsprout-core-musl.so sprout-guest-interposers-aarch64.tar.xz > SHA256SUMS

      # Fail loudly rather than ship silent garbage: ELF kinds plus the
      # interposer's ADR-0020 shm interpose must be present in both flavors
      # (they're the latest ABI registration, cf. crates/sprout-preload/csrc).
      - name: verify artifacts (ELF + ADR-0020 shm symbols present)
        run: |
          set -eu
          file dist/*
          nm -D dist/libsprout-core.so | grep -qE ' T shmget' || { echo 'glibc interposer missing shm interpose (ADR-0020)'; exit 1; }
          nm -D dist/libsprout-core-musl.so | grep -qE ' T shmget' || { echo 'musl interposer missing shm interpose (ADR-0020)'; exit 1; }
          echo OK: dist verified

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: sprout-guest-interposers
          path: dist/*
          retention-days: 30

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/book/html  # mdbook >=0.4.36 multi-backend layout: html/ and linkcheck/ subdirs
