name: Publish mdBook docs

# Deploy the mdBook in docs/ to GitHub Pages on every main push that touches
# it (or on manual dispatch). Static check lives in ci.yml's `docs` job; this
# workflow is publish-only so a docs-only typo doesn't block a green push CI
# page on gh-pages being enabled.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/mdbook-publish.yml'
  workflow_dispatch:

# One deploy at a time; a queued newer push supersedes an in-flight older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
