name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Android-only project: the ubuntu/ARM lanes (cargo test on a *glibc* runner,
# libsprout cross-build) were removed 2026-08-13 — green runs there proved
# nothing about the real target (Android kernel quirks are half the runtime).
# Static checks here are host-agnostic; runtime tests live in
# termux-selfhosted.yml (workflow_dispatch until a Termux runner attaches).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # pinned to the Termux device toolchain (see rust-toolchain.toml);
          # bump both together.
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --workspace -- -D warnings

  docs:
    name: mdBook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs
