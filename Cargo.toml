[workspace]
resolver = "2"
members = [
    "crates/sprout-cli",
    "crates/sprout-core",
    "crates/sprout-preload",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sprout-os/sprout"
homepage = "https://github.com/sprout-os/sprout"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.29", features = ["process", "ptrace", "signal", "fs"] }
thiserror = "1.0"

# The LD_PRELOAD core is C11, not Rust (see ADR-0001). Only Rust binaries
# below get profile tuning; the C shared object has its own build flags.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
