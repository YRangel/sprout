[book]
authors = ["sprout contributors"]
language = "en"
multilingual = false
src = "src"
title = "sprout — Rootless glibc Linux on Android"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/sprout-os/sprout"
edit-url-template = "https://github.com/sprout-os/sprout/edit/main/docs/{path}"

[output.linkcheck]
follow-web-links = false
# CI (peaceiris/actions-mdbook) installs mdbook only — without the linkcheck
# binary `mdbook build` hard-fails (rc=101). optional=true keeps CI green and
# still runs linkcheck locally when the plugin exists.
optional = true
